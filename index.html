<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>해인이의 Let's Go 말하기 게임</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@700;800;900&display=swap">
<style>
:root{--pink:#E0457B;--pinkL:#FDE7EE;--blue:#3B7DD8;--blueL:#E4EEFB;--green:#2FA36B;--greenL:#E2F5EA;--yellow:#F7C83C;--yellowL:#FFF6D9;--orange:#E8891F;--ink:#2B2B33;--mute:#7A7A88;--bg:#FFF9F1;--card:#fff;--line:#EADFD0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Nunito','Jua',sans-serif;font-weight:800}
.ko{font-family:'Jua',sans-serif;font-weight:400}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
#app{max-width:860px;margin:0 auto;padding:14px 16px 40px;min-height:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{font-family:'Jua';font-size:24px;display:flex;align-items:center;gap:8px}
.brand small{font-size:14px;color:var(--mute)}
.starbox{background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-size:20px;display:flex;align-items:center;gap:6px}
.iconbtn{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-size:16px}
.iconbtn:active{transform:scale(.96)}
h2{font-family:'Jua';font-weight:400;font-size:22px;margin:18px 4px 10px}
.units{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:17px;display:flex;gap:6px;align-items:center}
.chip .ko{font-size:14px;color:var(--mute)}
.chip.on{border-color:var(--pink);background:var(--pinkL)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.game{background:#fff;border:2.5px solid var(--line);border-radius:22px;padding:16px;text-align:left;display:flex;gap:14px;align-items:center;transition:transform .1s}
.game:active{transform:scale(.97)}
.game .em{font-size:46px;width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center;flex:none}
.game b{display:block;font-family:'Jua';font-weight:400;font-size:22px}
.game span{font-family:'Jua';font-size:14px;color:var(--mute)}
.note{font-family:'Jua';font-size:14px;color:var(--mute);background:#fff;border:2px dashed var(--line);border-radius:14px;padding:10px 14px;margin-top:16px;line-height:1.6}
.qno{font-size:20px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:5px 14px;white-space:nowrap}
.bar{height:14px;background:#fff;border:2px solid var(--line);border-radius:999px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),var(--orange));transition:width .3s}
.play{background:#fff;border:2.5px solid var(--line);border-radius:26px;padding:18px;text-align:center;position:relative}
.qtitle{font-family:'Jua';font-size:16px;color:var(--mute);margin-bottom:6px}
.pic{font-size:84px;line-height:1.1;min-height:100px;display:flex;align-items:center;justify-content:center;gap:4px;font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif}
.pic svg{height:150px;width:auto;max-width:100%}
.pic.m2{font-size:70px}.pic.m3{font-size:56px}.opt .pic.m2{font-size:46px}.opt .pic.m3{font-size:36px}
.pic.sm{font-size:56px;min-height:70px}.pic.sm svg{height:120px}
.say{font-size:28px;margin:10px 0 4px;line-height:1.3}
.kosub{font-family:'Jua';font-size:18px;color:var(--mute)}
.spk{display:inline-flex;align-items:center;gap:6px;background:var(--blueL);color:var(--blue);border-radius:999px;padding:8px 16px;font-size:17px;margin:8px 4px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.opt{background:#fff;border:3px solid var(--line);border-radius:20px;padding:12px;font-size:22px;min-height:76px;display:flex;align-items:center;justify-content:center;gap:8px}
.opt .pic{font-size:60px;min-height:70px}.opt .pic svg{height:74px}
.opt.right{border-color:var(--green);background:var(--greenL)}
.opt.wrong{border-color:#E06060;background:#FDECEC;animation:shake .35s}
.opts.one{grid-template-columns:1fr}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.slot{min-height:64px;border:3px dashed var(--line);border-radius:18px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-top:14px;background:var(--bg)}
.slot.ok{border-color:var(--green);border-style:solid;background:var(--greenL)}
.slot.no{border-color:#E06060;animation:shake .35s}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px;min-height:56px}
.tile{background:#fff;border:3px solid var(--blue);color:var(--blue);border-radius:14px;padding:8px 14px;font-size:22px;box-shadow:0 3px 0 var(--blue)}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 var(--blue)}
.tile.used{visibility:hidden}
.slot .tile{border-color:var(--pink);color:var(--pink);box-shadow:0 3px 0 var(--pink)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.big{border-radius:18px;padding:14px 22px;font-size:20px;font-family:'Jua';font-weight:400;color:#fff;background:var(--pink);box-shadow:0 4px 0 #B8305F}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #B8305F}
.big.blue{background:var(--blue);box-shadow:0 4px 0 #2A5FA8}
.big.green{background:var(--green);box-shadow:0 4px 0 #227A50}
.big.gray{background:#fff;color:var(--ink);border:2.5px solid var(--line);box-shadow:0 4px 0 var(--line)}
.big:disabled{opacity:.4}
.mic{width:110px;height:110px;border-radius:50%;background:var(--pink);color:#fff;font-size:50px;box-shadow:0 6px 0 #B8305F;display:inline-flex;align-items:center;justify-content:center;margin-top:12px}
.mic.rec{animation:pulse 1s infinite;background:#E84A5F}
@keyframes pulse{50%{box-shadow:0 0 0 18px rgba(232,74,95,.18),0 6px 0 #B8305F}}
.heard{font-size:20px;margin-top:12px;min-height:30px}
.heard .hit{color:var(--green)}.heard .miss{color:#D64545;text-decoration:underline wavy}
.fb{font-family:'Jua';font-size:24px;margin-top:10px;min-height:34px}
.model{font-size:26px;margin-top:10px;color:var(--pink)}
.hide{display:none!important}
.pop{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:120px;z-index:9;opacity:0}
.pop.show{animation:pop .8s}
@keyframes pop{0%{opacity:0;transform:scale(.4)}30%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(1)}}
.end{text-align:center;padding:20px}
.end .stars{font-size:42px;letter-spacing:2px;display:flex;flex-wrap:wrap;justify-content:center;gap:2px}
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px}
.st{aspect-ratio:1;background:#fff;border:2.5px solid var(--line);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:44px;font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji'}
.st.lock{font-size:22px;color:#ccc;background:#faf6f0;font-family:'Jua'}
.status{font-family:'Jua';font-size:14px;padding:4px 10px;border-radius:999px;display:inline-block}
.status.on{background:var(--greenL);color:var(--green)}.status.off{background:var(--yellowL);color:#A27800}
.ctx{font-size:20px;color:var(--blue);margin-bottom:4px}
.tlink{font-family:Jua;font-size:13px;color:#999;text-decoration:underline}
.foot{text-align:right;font-family:'Jua';font-size:12px;color:#bbb;margin-top:24px}
@media (max-width:520px){.say{font-size:23px}.opt{font-size:18px}.tile{font-size:19px;padding:7px 11px}.pic{font-size:70px}}
</style>
</head>

<div id="app"></div>

function miss(key){const m=save.miss[key]||{c:0};m.c++;m.t=Date.now();save.miss[key]=m;
 const p=key.split('|');const k=p[0]==='말하기'?p[0]+'|'+p[1]:key;save.missLog=save.missLog||[];save.missLog.push({t:m.t,k,h:p[0]==='말하기'?(p[2]||''):''});if(save.missLog.length>600)save.missLog=save.missLog.slice(-600);persist();}

try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}
function speak(t,rate){rate=rate||save.cfg.rate;return new Promise(res=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/❌|⭕/g,''));u.lang='en-US';if(voice)u.voice=voice;u.rate=rate;u.onend=res;u.onerror=res;speechSynthesis.speak(u);setTimeout(res,(700+t.length*75)/rate);}catch(e){res();}});}
let actx=null;
function tone(ok){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const notes=ok?[660,880,1175]:[300,220];notes.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=ok?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,actx.currentTime+i*.09);g.gain.exponentialRampToValueAtTime(.25,actx.currentTime+i*.09+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+i*.09+.25);o.connect(g).connect(actx.destination);o.start(actx.currentTime+i*.09);o.stop(actx.currentTime+i*.09+.3);});}catch(e){}}

// 천천히 말해도 끊기지 않게: 계속 듣다가 '말이 멈춘 뒤 N초' 지나면 끝. 마이크를 한 번 더 누르면 바로 끝.
let curRec=null;
function listen(onPart){return new Promise((res,rej)=>{
 let r;try{r=new SR();}catch(e){rej('x');return;}
 r.lang='en-US';r.continuous=true;r.interimResults=true;r.maxAlternatives=5;
 const WAIT=(+save.cfg.wait||4)*1000,FIRST=12000,MAX=30000,t0=Date.now();
 let segs=[],base=0,interim='',heard=false,last=t0,stopping=false,ended=false,timer=null;
 const best=()=>{const a=segs.filter(Boolean).map(s=>s[0]).filter(Boolean);const o=[];
  for(const s of a){const p=o[o.length-1];if(p&&s.toLowerCase().startsWith(p.toLowerCase()))o[o.length-1]=s;else o.push(s);}return o;};
 const textNow=()=>(best().join(' ')+' '+interim).trim();
 const done=()=>{if(ended)return;ended=true;clearInterval(timer);curRec=null;
  const S=segs.filter(Boolean),n=Math.max(1,...S.map(s=>s.length)),alts=[];
  for(let j=0;j<n;j++){const o=[];for(const s of S){const t=s[Math.min(j,s.length-1)];const p=o[o.length-1];
    if(p&&t.toLowerCase().startsWith(p.toLowerCase()))o[o.length-1]=t;else if(t)o.push(t);}
   const t=(o.join(' ')+' '+interim).trim();if(t&&!alts.includes(t))alts.push(t);}
  res(alts);};
 const stop=()=>{if(stopping)return;stopping=true;try{r.stop();}catch(e){}setTimeout(done,1500);};
 curRec={stop};
 r.onresult=e=>{interim='';
  for(let i=e.resultIndex;i<e.results.length;i++){const x=e.results[i];
   if(x.isFinal){const a=[];for(const y of x)a.push(y.transcript.trim());segs[base+i]=a;}
   else interim+=' '+x[0].transcript;}
  interim=interim.trim();
  if(textNow()){heard=true;last=Date.now();}
  if(onPart)onPart(textNow());};
 r.onerror=e=>{const er=e.error||'x';if(er==='no-speech'||er==='aborted')return;
  if(['not-allowed','service-not-allowed','audio-capture','network'].includes(er)){ended=true;clearInterval(timer);curRec=null;rej(er);}};
 r.onend=()=>{if(ended)return;
  if(!stopping&&Date.now()-t0<MAX){ // 브라우저가 혼자 끊으면 이어서 다시 듣기
   if(interim){segs.push([interim]);interim='';}base=segs.length;
   try{r.start();return;}catch(e){}}
  done();};
 timer=setInterval(()=>{const now=Date.now();
  if((!heard&&now-t0>FIRST)||(heard&&now-last>WAIT)||now-t0>MAX)stop();},200);
 try{r.start();}catch(e){clearInterval(timer);curRec=null;rej('x');}
});}
const NUM={zero:'0',one:'1',two:'2',three:'3',four:'4',five:'5',six:'6',seven:'7',eight:'8',nine:'9',ten:'10'};
function norm(s){
 s=' '+s.toLowerCase().replace(/[’‘`]/g,"'")+' ';
 // 축약형·풀어 쓴 형태·아포스트로피 빠진 형태를 모두 같은 말로 봐요 (It's = It is = Its)
 const C=[[/\bwhat'?s\b/g,'what is'],[/\bit'?s\b/g,'it is'],[/\bi'?m\b/g,'i am'],[/\bhe'?s\b/g,'he is'],[/\bshe'?s\b/g,'she is'],[/\bthey'?re\b/g,'they are'],[/\bwe'?re\b/g,'we are'],[/\byou'?re\b/g,'you are'],[/\bisn'?t\b/g,'is not'],[/\baren'?t\b/g,'are not'],[/\bcan'?t\b/g,'can not'],[/\bcannot\b/g,'can not'],[/\bdoesn'?t\b/g,'does not'],[/\bdon'?t\b/g,'do not'],[/\bthere'?s\b/g,'there is'],[/\bwhere'?s\b/g,'where is'],[/\bwho'?s\b/g,'who is'],[/\bthat'?s\b/g,'that is'],[/\bscott'?s\b/g,'scott'],[/\bok\b|\bo\.k\.|\bokay\b/g,'okay'],[/\byoyo\b|\byo yo\b/g,'yo-yo'],[/\bt\.?v\.?\b/g,'tv']];
 for(const[a,b]of C)s=s.replace(a,b);
 return s.replace(/[^a-z0-9\- ]/g,' ').split(/\s+/).filter(Boolean).map(w=>NUM[w]||w).filter(w=>!['a','an','the','uh','um'].includes(w));
}
function score(target,alts){
 const t=norm(target);let best={r:0,hit:[]};
 for(const a of alts){const h=norm(a);const pool=[...h];const hit=t.map(w=>{const i=pool.findIndex(x=>x===w||(w.length>3&&(x.startsWith(w.slice(0,w.length-1))||w.startsWith(x)&&x.length>3)));if(i>=0){pool.splice(i,1);return true;}return false;});let r=hit.filter(Boolean).length/t.length;t.forEach((w,i)=>{if(w==='not'&&!hit[i])r=Math.min(r,.5);});if(r>best.r)best={r,hit,heard:a};}
 if(!best.heard)best.heard=alts[0]||'';
 return best;
}

function markWords(target,hit){let k=0;return target.split(' ').map(w=>{const n=norm(w).length;if(!n)return `<span>${w}</span>`;const ok=hit.slice(k,k+n).every(Boolean);k+=n;return `<span class="${ok?'hit':'miss'}">${w}</span>`;}).join(' ');}

function wordGame(){
 const all=pool('words');const items=pick(all,Math.min(save.cfg.n,all.length)).map(it=>({it,mode:Math.random()<.5?'listen':'read'}));
 newGame('word',items);G.render=renderWord;renderWord();
}
function renderWord(){
 const {it,mode}=G.items[G.i];const all=pool('words');
 const others=pick(all.filter(x=>x.w!==it.w),3);const opts=shuf([it,...others]);G.cur={it,opts,tries:0};
 const body=mode==='listen'
  ?`<div class="qtitle ko">잘 듣고 알맞은 그림을 골라요</div><button class="big blue" style="font-size:26px;padding:20px 30px" onclick="speak(G.cur.it.w)">🔊 다시 듣기</button>
    <div class="opts">${opts.map((o,i)=>`<button class="opt" id="o${i}" onclick="ansWord(${i})">${picHTML(o.p)}</button>`).join('')}</div>`
  :`<div class="qtitle ko">그림에 맞는 단어를 골라요</div>${picHTML(it.p)}<div class="kosub">${it.k}</div>
    <div class="opts">${opts.map((o,i)=>`<button class="opt" id="o${i}" onclick="ansWord(${i})">${o.w}</button>`).join('')}</div>`;
 R(topBar(true)+`<div class="play">${body}</div>`);
 if(mode==='listen')setTimeout(()=>speak(it.w),300);
}
function ansWord(i){
 const c=G.cur;if(c.done)return;const o=c.opts[i];const el=$('#o'+i);
 if(o.w===c.it.w){c.done=true;el.classList.add('right');if(c.tries===0)right(1);else{G.got++;tone(true);}
  speak(c.it.w);setTimeout(next,900);
 }else{if(!c.tries)miss('단어|'+c.it.w);c.tries++;el.classList.add('wrong');tone(false);el.disabled=true;}
}

 G.cur={it,t,end,picked:[],order:shuf(t.map((w,i)=>({w,i}))),tries:0};
 R(topBar(true)+`<div class="play"><div class="qtitle ko">우리말을 보고 영어 문장을 만들어요</div>${picHTML(it.p,'sm')}
 ${it.ctx?`<div class="ctx">🗨️ ${it.ctx} <button class="spk" style="margin:0 0 0 4px;padding:4px 10px" onclick="speak('${it.ctx.replace(/'/g,"\\'")}')">🔊</button></div>`:''}
 <div class="say ko" style="font-size:26px">“${it.ko}”</div>
 <div class="slot" id="slot"></div><div class="tiles" id="tiles"></div>
 <div class="row"><button class="big gray" onclick="undoB()">↩ 하나 빼기</button><button class="big" id="chk" onclick="checkB()">다 했어요 ✔</button></div><div class="fb" id="fb"></div></div>`);
 drawB();
}
function drawB(){const c=G.cur;
 $('#slot').innerHTML=c.picked.map((k,j)=>`<button class="tile" onclick="unB(${j})">${c.order[k].w}</button>`).join('')+(c.picked.length===c.t.length?`<span style="font-size:24px">${c.end}</span>`:'');
 $('#tiles').innerHTML=c.order.map((o,k)=>`<button class="tile ${c.picked.includes(k)?'used':''}" onclick="pickB(${k})">${o.w}</button>`).join('');
 $('#slot').classList.remove('ok','no');}
function pickB(k){const c=G.cur;if(c.done||c.picked.includes(k))return;c.picked.push(k);drawB();}
function unB(j){const c=G.cur;if(c.done)return;c.picked.splice(j,1);drawB();}
function undoB(){const c=G.cur;if(c.done)return;c.picked.pop();drawB();}
function checkB(){const c=G.cur;if(c.done)return;
 if(c.picked.length<c.t.length){$('#fb').textContent='블록을 다 써야 해요!';return;}
 const s=c.picked.map(k=>c.order[k].w).join(' ');
 if(s===c.t.join(' ')){c.done=true;$('#slot').classList.add('ok');if(c.tries===0)right(1);else{G.got++;tone(true);}
  $('#fb').innerHTML='정답! 이제 소리 내어 읽어 봐요 🗣️';$('#chk').disabled=true;
  speak(c.it.en).then(()=>{$('.row').innerHTML=`<button class="big blue" onclick="speak(G.cur.it.en)">🔊 다시 듣기</button><button class="big green" onclick="next()">다음 ▶</button>`;});
 }else{if(!c.tries)miss('영작|'+c.it.en);c.tries++;$('#slot').classList.add('no');tone(false);
  // 맞는 앞부분은 남기고 나머지는 되돌리기
  let ok=0;while(ok<c.picked.length&&c.order[c.picked[ok]].w===c.t[ok])ok++;
  $('#fb').textContent=c.tries>=2?`힌트: “${c.t.slice(0,ok+1).join(' ')} …”`:'앗, 순서가 달라요. 다시 해 봐요!';
  setTimeout(()=>{c.picked=c.picked.slice(0,ok);drawB();},700);}
}

}

 if(micOK){
  $('#sayArea').innerHTML=`<div><button class="mic" id="mic" onclick="recSay()">🎤</button></div><div class="kosub" id="tip" style="margin-top:10px">마이크를 누르고 대답해요</div>

 }else{
  $('#sayArea').innerHTML=`<div class="fb ko" id="fb">소리 내어 대답해 봐요! 🗣️</div><div class="model hide" id="model"></div>

function hintSay(){const c=G.cur;c.hint=true;const w=c.it.a.split(' ');$('#model').classList.remove('hide');$('#model').textContent=w.slice(0,Math.ceil(w.length/2)).join(' ')+' …';}
function showModel(){const c=G.cur;$('#model').classList.remove('hide');$('#model').innerHTML=`${c.it.a}<div class="kosub">${c.it.ak}</div>`;
 speak(c.it.a);$('#fb').textContent='해인이가 말한 거랑 같았나요?';
 $('#selfRow').innerHTML=`<button class="big gray" onclick="speak(G.cur.it.a)">🔊 다시 듣기</button><button class="big gray" onclick="renderSay()">🔁 다시 말하기</button><button class="big green" onclick="selfOK()">👍 똑같이 말했어요</button>`;}
function selfOK(){right(G.cur.hint?1:2);setTimeout(next,600);}
async function recSay(){const c=G.cur;if(c.busy&&curRec){curRec.stop();$('#tip').textContent='잠깐만요…';return;}if(c.busy||c.done)return;c.busy=true;
 try{speechSynthesis.cancel();}catch(e){}
 $('#mic').classList.add('rec');$('#tip').textContent='듣고 있어요… 천천히 말해도 괜찮아요. 다 말하면 🎤 한 번 더 눌러요';
 let alts;try{alts=await listen(t=>{const h=$('#heard');if(h)h.innerHTML=`<div class="kosub">🎤 ${t.replace(/</g,'')} …</div>`;});}catch(err){c.busy=false;$('#mic').classList.remove('rec');
  if(['not-allowed','service-not-allowed','audio-capture','network','x'].includes(err)){micOK=false;drawSay();$('#fb').textContent=err==='network'?'인터넷이 필요해요. 오늘은 따라 말하기로 해요!':'마이크를 쓸 수 없어서 따라 말하기로 바꿨어요.';}
  else{$('#tip').textContent='잘 안 들렸어요. 다시 눌러 볼까요?';}return;}
 c.busy=false;$('#mic').classList.remove('rec');$('#tip').textContent='마이크를 누르고 대답해요';
 if(!alts.length){$('#fb').textContent='잘 안 들렸어요. 조금 더 크게! 📢';return;}
 const s=score(c.it.a,alts);c.tries++;
 $('#heard').innerHTML=`<div class="kosub">들린 말: “${s.heard}”</div>${markWords(c.it.a,s.hit)}`;
 if(s.r>=save.cfg.pass){c.done=true;const st=(s.r===1&&!c.hint&&c.tries===1)?2:1;right(st);
  $('#fb').textContent=s.r===1?'완벽해요! 🌟':'좋아요! 거의 다 맞았어요 👏';
  $('#model').classList.remove('hide');$('#model').innerHTML=`${c.it.a}<div class="kosub">${c.it.ak}</div>`;
  speak(c.it.a).then(()=>setTimeout(next,700));
 }else{tone(false);if(c.tries===1)miss('말하기|'+c.it.a+'|'+s.heard);
  if(c.tries>=3){$('#fb').textContent='정답을 듣고 따라 말해 봐요';$('#model').classList.remove('hide');$('#model').innerHTML=`${c.it.a}<div class="kosub">${c.it.ak}</div>`;speak(c.it.a);
   $('.row').innerHTML=`<button class="big gray" onclick="speak(G.cur.it.a)">🔊 다시 듣기</button><button class="big green" onclick="next()">다음 ▶</button>`;}
  else $('#fb').textContent=s.r>=.4?'빨간 단어를 넣어서 다시! 💪':'다시 한 번 말해 봐요! 💪';}
}

function renderTalk(){
 const it=G.items[G.i];const all=[];for(const u of [1,2,3,4,5,6])for(const x of UNITS[u].talk)all.push(x);

 const opts=shuf([it,...wrong]);G.cur={it,opts,tries:0};
 R(topBar(true)+`<div class="play"><div class="qtitle ko">질문에 알맞은 대답을 골라요</div>${picHTML(it.p,'sm')}

function ansTalk(i){const c=G.cur;if(c.done)return;const el=$('#o'+i);
 if(c.opts[i].a===c.it.a){c.done=true;el.classList.add('right');if(c.tries===0)right(1);else{G.got++;tone(true);}

 }else{if(!c.tries)miss('대화|'+c.it.q+' → '+c.it.a);c.tries++;el.classList.add('wrong');el.disabled=true;tone(false);}

async function talkMic(){const c=G.cur;if(c.busy&&curRec){curRec.stop();return;}if(c.bonus||c.busy)return;c.busy=true;$('#heard').textContent='듣고 있어요… 천천히 말해도 돼요. 다 말하면 🎤 버튼을 한 번 더 눌러요';
 try{const alts=await listen(t=>{const h=$('#heard');if(h)h.innerHTML=`<div class="kosub">🎤 ${t.replace(/</g,'')} …</div>`;});const s=score(c.it.a,alts);
  $('#heard').innerHTML=alts.length?markWords(c.it.a,s.hit):'잘 안 들렸어요. 다시 눌러 봐요!';

 }catch(e){micOK=false;$('#heard').textContent='마이크를 쓸 수 없어요. 소리 내어 말하고 다음으로!';}

 <div class="note" style="margin-top:0">기록·별·설정은 <b>이 기기, 이 브라우저</b>에만 저장돼요. 해인이가 다른 기기로 하면 그 기기에서 이 페이지를 열어 봐야 해요.</div>

  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">${Object.keys(GNAME).map(g=>`<span class="chip" style="font-size:14px">${GNAME[g]} <span class="ko">${per[g]?per[g].c+'판 · '+Math.round(per[g].s/per[g].c*100)+'%':'아직 안 함'}</span></span>`).join('')}</div>`)}
 ${box('❗ 자주 틀린 문제 (처음에 틀린 횟수 순)',misses.length?`<table style="width:100%;border-collapse:collapse;font-size:15px"><tr><th ${th}>종류</th><th ${th}>문제</th><th ${th}>횟수</th><th ${th}>마지막</th></tr>${misses.map(missRow).join('')}</table>`:'<div class="kosub">아직 틀린 문제가 없어요.</div>')}
 ${box('🕒 최근 기록',log.length?`<table style="width:100%;border-collapse:collapse;font-size:15px"><tr><th ${th}>날짜</th><th ${th}>게임</th><th ${th}>Unit</th><th ${th}>맞힘</th><th ${th}>별</th></tr>${log.slice(-25).reverse().map(x=>`<tr><td ${td}>${fmtD(x.t)}</td><td ${td}>${GNAME[x.g]}</td><td ${td}>${x.u.join(',')}</td><td ${td}>${x.got} / ${x.n}</td><td ${td}>${x.st}</td></tr>`).join('')}</table>`:'<div class="kosub">아직 기록이 없어요.</div>')}
 ${box('⚙️ 설정 <span id="saved" class="kosub" style="font-size:14px;color:var(--green)"></span>',`<div style="display:grid;grid-template-columns:auto 1fr;gap:12px 16px;align-items:center;font-family:Jua;font-weight:400;font-size:16px">

  <div>말하기 채점</div><div>${sel('cP',[[0.6,'너그럽게 (60%)'],[0.75,'보통 (75%)'],[1,'정확하게 (100%)']],save.cfg.pass)}</div>
  <div>말 멈추면 기다리는 시간</div><div>${sel('cW',[[2.5,'짧게 (2.5초)'],[4,'천천히 (4초)'],[6,'아주 천천히 (6초)']],save.cfg.wait)}</div>
  <div>마이크</div><div>${sel('cM',[['auto','자동 (되면 쓰기)'],['off','끄기 (따라 말하기 모드)']],save.cfg.mic)} <span class="kosub" style="font-size:13px">지금: ${micOK?'마이크 채점':'따라 말하기'}</span></div></div>
  <div class="kosub" style="font-size:13px;margin-top:10px">말하기 채점은 It's = It is, isn't = is not처럼 줄임말과 풀어 쓴 말을 같게 봐요. a / the는 빠져도 괜찮아요.</div>`)}
 ${box('⭐ 별 주기 · 빼기',`<div class="row" style="justify-content:flex-start;margin-top:0"><button class="big green" onclick="giveStar(1)">+1</button><button class="big green" onclick="giveStar(5)">+5</button><button class="big green" onclick="giveStar(10)">+10 (스티커 1개)</button><button class="big gray" onclick="giveStar(-1)">−1</button></div><div class="kosub" style="font-size:13px;margin-top:8px">수업 시간 보상이나 숙제 칭찬으로 써요.</div>`)}
 ${box('🧹 초기화',`<div class="row" style="justify-content:flex-start;margin-top:0">${danger('r1','별·스티커 0으로')}${danger('r2','기록·틀린 문제 지우기')}${danger('r3','전부 처음처럼')}</div><div class="kosub" style="font-size:13px;margin-top:8px">버튼을 두 번 눌러야 지워져요. 지운 건 되돌릴 수 없어요.</div>`)}
 ${box('📚 게임에 들어 있는 교재 내용',[1,2,3,4,5,6].map(u=>{const U=UNITS[u];return `<details style="margin-bottom:8px"><summary style="cursor:pointer;font-size:17px">Unit ${u} <span class="ko" style="color:var(--mute)">${U.ko} · 단어 ${U.words.length} · 대화 ${U.talk.length} · 동작 ${U.act.length}</span></summary>
  <div style="font-size:15px;line-height:1.7;padding:6px 4px 4px 16px"><div><b class="ko">단어</b> ${U.words.map(w=>w[0]).join(' · ')}</div>
  <div style="margin-top:4px"><b class="ko">대화</b>${U.talk.map(t=>`<div>• ${t.q} → <span style="color:var(--pink)">${t.a}</span></div>`).join('')}</div>
  <div style="margin-top:4px"><b class="ko">동작</b> ${U.act.map(a=>a[0]).join(' · ')}</div></div></details>`;}).join(''))}
 <div class="foot">메타민지클래스</div>`);
 window.scrollTo(0,0);
}// ================== 선생님께 기록 보내기 ==================
let repRange='since';
function repFrom(){const now=Date.now();
 if(repRange==='since')return save.lastSent||(now-7*864e5);
 if(repRange==='7')return now-7*864e5;
 if(repRange==='30')return now-30*864e5;
 return 0;}
function md(t){const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()}`;}
function buildReport(){
 const from=repFrom(),now=Date.now();
 const L=save.log.filter(x=>x.t>=from),M=(save.missLog||[]).filter(x=>x.t>=from);
 const first=L.length?Math.min(...L.map(x=>x.t)):from;
 const days=new Set(L.map(x=>new Date(x.t).toDateString())).size;
 const lines=[`[해인 Let's Go 기록] ${from?md(Math.max(from,first)):md(first)} ~ ${md(now)}`];
 if(!L.length){lines.push('• 이 기간에는 한 판도 하지 않았어요.');}
 else{
  const per={};for(const x of L){const p=per[x.g]||(per[x.g]={c:0,s:0});p.c++;p.s+=x.got/x.n;}
  const avg=Math.round(L.reduce((a,x)=>a+x.got/x.n,0)/L.length*100);
  const st=L.reduce((a,x)=>a+(x.st||0),0);
  const units=[...new Set(L.flatMap(x=>x.u))].sort().join(',');
  lines.push(`• 연습한 날: ${days}일 · 한 판 수: ${L.length}판`);
  lines.push(`• 게임별: ${Object.keys(GNAME).filter(g=>per[g]).map(g=>`${GNAME[g]} ${per[g].c}판(${Math.round(per[g].s/per[g].c*100)}%)`).join(', ')}`);
  lines.push(`• 평균 정답률: ${avg}% · 이 기간 별 ${st}개`);
  lines.push(`• 연습한 Unit: ${units}`);
 }
 lines.push(`• 지금까지 모은 별 ${save.stars}개 · 스티커 ${Math.min(Math.floor(save.stars/PER),STICKERS.length)}개`);
 const cnt={};for(const x of M){const c=cnt[x.k]||(cnt[x.k]={c:0,h:''});c.c++;if(x.h)c.h=x.h;}
 const top=Object.entries(cnt).sort((a,b)=>b[1].c-a[1].c).slice(0,8);
 if(top.length){lines.push('• 자주 틀린 것:');for(const[k,v]of top){const[p,...r]=k.split('|');lines.push(`  ${KIND[p]||p} ${r[0]}${v.h?` (들린 말: "${v.h}")`:''}${v.c>1?' ×'+v.c:''}`);}}
 else if(L.length)lines.push('• 틀린 문제 없음 👏');
 return lines.join('\n');
}
function report(){
 G=null;try{speechSynthesis.cancel();}catch(e){}
 const txt=buildReport();
 const opt=(v,l)=>`<button class="chip ${repRange===v?'on':''}" style="font-size:15px" onclick="repRange='${v}';report()">${l}</button>`;
 R(`<div class="top"><button class="iconbtn" onclick="home()">🏠 처음으로</button><div class="brand" style="font-size:20px">📤 선생님께 기록 보내기</div></div>
 <div class="play" style="text-align:left">
  <div class="ko" style="font-size:18px">1. 어느 기간을 보낼까요?</div>
  <div class="units" style="margin:8px 0 16px">${opt('since',save.lastSent?`지난번 보낸 뒤 (${md(save.lastSent)}~)`:'최근 7일 (처음 보내기)')}${opt('7','최근 7일')}${opt('30','최근 30일')}${opt('all','전체')}</div>
  <div class="ko" style="font-size:18px">2. 아래 내용을 복사해요</div>
  <textarea id="repTxt" readonly style="width:100%;height:260px;margin-top:8px;font:15px/1.6 'Nunito','Jua',sans-serif;font-weight:700;border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--bg);resize:vertical">${txt.replace(/</g,'&lt;')}</textarea>
  <div class="row"><button class="big" id="cpBtn" onclick="copyReport()">📋 복사하기</button></div>
  <div class="fb ko" id="cpMsg" style="text-align:center;font-size:18px"></div>
  <div class="ko" style="font-size:18px;margin-top:6px">3. 카카오톡 선생님 대화방에 붙여넣어 보내 주세요</div>
  <div class="kosub" style="font-size:14px;margin-top:4px;line-height:1.6">입력창을 꾹 누르거나(휴대폰) Ctrl+V(컴퓨터)로 붙여넣기 할 수 있어요. 일주일에 한두 번 보내 주시면 수업 때 틀린 부분을 다시 연습할게요.</div>
 </div><div class="foot">메타민지클래스</div>`);
}
async function copyReport(){
 const ta=$('#repTxt'),msg=$('#cpMsg');let ok=false;
 try{await navigator.clipboard.writeText(ta.value);ok=true;}catch(e){}
 if(!ok){try{ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);ok=document.execCommand('copy');}catch(e){}}
 if(ok){save.lastSent=Date.now();persist();msg.style.color='var(--green)';msg.textContent='복사됐어요! 이제 카톡에 붙여넣기 해 주세요 ✔';$('#cpBtn').textContent='✔ 복사 완료';}
 else{ta.focus();ta.select();msg.style.color='#C9306A';msg.textContent='자동 복사가 안 돼요. 글 상자를 꾹 눌러 전체 선택 → 복사해 주세요.';}
}

function route(){if(location.hash==='#teacher')teacherLock();else home();}
window.addEventListener('hashchange',()=>{if(location.hash==='#teacher')teacherLock();});
route();
</script>
